# 生产 nginx（ECS 部署示例，TLS 轨预留）
server {
    listen 80;
    server_name cryptoquest.example.com;
    root /var/www/cryptoquest;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 预留 TLS 轨
    # listen 443 ssl;
    # ssl_certificate /etc/nginx/ssl/cryptoquest.pem;
    # ssl_certificate_key /etc/nginx/ssl/cryptoquest.key;
}